
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Jugador de Fútbol</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Color de fondo */
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #0d6efd;
        }
        #team-badge {
            display: block;
            margin: 0 auto 10px;
        }
        #clue, #team-name, #player-status {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #message {
            margin-top: 20px;
            text-align: center;
            font-size: 1.2rem;
            color: green;
        }
        #counter {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
        .suggestions-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }
        .suggestions-list li {
            padding: 5px 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }
        .suggestions-list li:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Adivina el Jugador</h1>
        <div id="clue" class="alert alert-info" role="alert">
            <!-- Pista se mostrará aquí -->
            Aquí aparecerá la pista del jugador.
        </div>
        <div class="team-info text-center">
            <img id="team-badge" src="" alt="Escudo del equipo" width="100" class="img-fluid">
            <div id="team-name" class="mb-2">Equipo: Desconocido</div>
            <div id="player-status" class="text-muted">Estado del jugador</div>
        </div>
        <div class="input-group mb-3">
            <input type="text" id="guess" class="form-control" placeholder="Escribe el nombre del jugador">
            <button id="check-button" class="btn btn-primary">Comprobar</button>
        </div>
        <ul id="suggestions" class="suggestions-list border rounded"></ul>
        <div id="message" class="mt-3"></div>
        <div id="counter" class="text-center text-success">Jugadores acertados: 0</div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
