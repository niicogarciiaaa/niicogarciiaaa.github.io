<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="ejercicio1.js" defer></script>
    <style>
        ul{
            list-style-type: none;
        }
        input[type="checkbox"]{
            margin-left: 10px;
        }

    </style>
</head>
<body class="bg-light">

    <!-- Contenedor principal -->
    <div class="container py-5">
        <div class="row g-4">
            <!-- Lista de Tareas para Carballo -->
            <div class="col-lg-6 col-md-12">
                <div class="card shadow h-100">
                    <div class="card-header bg-primary text-white">
                        <h2 class="h4 text-center mb-0">Lista de tareas para Carballo</h2>
                    </div>
                    <div class="card-body overflow-auto" style="max-height: 300px;">
                        <form id="formularioCarballo" class="input-group mb-3">
                            <input type="text" id="TextoTareaCarballo" class="form-control" placeholder="Añadir tarea">
                            <button type="submit" class="btn btn-primary">Crear</button>
                        </form>
                        <ul id="listaTareasCarballo" class="list-group"></ul>
                    </div>
                </div>
            </div>

            <!-- Lista de Tareas para Ponteceso -->
            <div class="col-lg-6 col-md-12">
                <div class="card shadow h-100">
                    <div class="card-header bg-success text-white">
                        <h2 class="h4 text-center mb-0">Lista de tareas para Ponteceso</h2>
                    </div>
                    <div class="card-body overflow-auto" style="max-height: 300px;">
                        <form id="formularioPonteceso" class="input-group mb-3">
                            <input type="text" id="TextoTareaPonteceso" class="form-control" placeholder="Añadir tarea">
                            <button type="submit" class="btn btn-success">Crear</button>
                        </form>
                        <ul id="listaTareasPonteceso" class="list-group"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
