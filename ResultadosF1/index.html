<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos.css">
  <script src="script.js"></script>
  <title>Resultados F1</title>
</head>
<body>
  <h1>Resultados F1</h1>

  <label for="season">Selecciona una temporada:</label>
  <select id="season"></select><br/>
  <button onclick="cargarResultados()" class="button">Cargar Resultados</button>

  <h2>Clasificación de Pilotos</h2>
  <table id="tablaPilotos">
    <thead>
      <tr class="encabezado">
        <th>Posición</th>
        <th>Piloto</th>
        <th>Equipo</th>
        <th>Puntos</th>
        <th>Detalles</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Clasificación de Constructores</h2>
  <table id="tablaConstructores">
    <thead>
      <tr class="encabezado">
        <th>Posición</th>
        <th>Constructor</th>
        <th>Puntos</th>
        <th>Detalles</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  
</body>
</html>
