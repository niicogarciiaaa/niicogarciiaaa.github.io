<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Efecto hover para filas de tabla */
    #tablaPilotos tbody tr:hover, 
    #tablaConstructores tbody tr:hover {
      transform: scale(1.05); /* Hace que la fila crezca ligeramente */
      transition: transform 0.3s ease; /* Transición suave */
    }

    /* Estilo para el modo oscuro */
    body.dark-mode {
      background-color: #121212;
      color: #f5f5f5;
    }

    body.dark-mode .table {
      background-color: #1e1e1e;
      border-color: #333;
    }

    body.dark-mode .table-dark {
      background-color: #2b2b2b;
      color: #f5f5f5;
    }

    body.dark-mode .table-striped > tbody > tr:nth-of-type(odd) {
      --bs-table-accent-bg: #292929;
    }

    body.dark-mode .btn-primary {
      background-color: #444;
      border-color: #555;
      color: #f5f5f5;
    }

    body.dark-mode .btn-secondary {
      background-color: #666;
      border-color: #777;
      color: #fff;
    }

    body.dark-mode select,
    body.dark-mode input {
      background-color: #333;
      color: #f5f5f5;
      border-color: #555;
    }

    body.dark-mode h1, 
    body.dark-mode h2 {
      color: #fff;
    }
  </style>
  <script src="script.js" defer></script>
  <title>Resultados F1</title>
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="text-center">Resultados F1</h1>
      <button id="darkModeToggle" class="btn btn-secondary">🌙 Modo Oscuro</button>
    </div>

    <!-- Season Select and Button -->
    <div class="mb-4">
      <label for="season" class="form-label">Selecciona una temporada:</label>
      <select id="season" class="form-select mb-2"></select><br/>
      <button onclick="cargarResultados()" class="btn btn-primary">Cargar Resultados</button>
    </div>

    <!-- Pilots Classification -->
    <h2 class="mb-3">Clasificación de Pilotos</h2>
    <table id="tablaPilotos" class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Posición</th>
          <th>Piloto</th>
          <th>Equipo</th>
          <th>Puntos</th>
          <th>Detalles</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- Constructors Classification -->
    <h2 class="mb-3">Clasificación de Constructores</h2>
    <table id="tablaConstructores" class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Posición</th>
          <th>Constructor</th>
          <th>Puntos</th>
          <th>Detalles</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Bootstrap JS and dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

  <script>
    // Script para alternar entre modo claro y oscuro
    const darkModeToggle = document.getElementById('darkModeToggle');
    darkModeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDarkMode = document.body.classList.contains('dark-mode');
      darkModeToggle.textContent = isDarkMode ? '☀️ Modo Claro' : '🌙 Modo Oscuro';
    });
  </script>
</body>
</html>
