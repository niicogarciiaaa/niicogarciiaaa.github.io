<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados F1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Resultados de Fórmula 1</h1>
    <label for="season">Selecciona una temporada:</label>
    <select id="season" onchange="cargarResultados()">
      <option value="">--Selecciona--</option>
    </select>
  </header>

  <main>
    <table id="resultados">
      <thead>
        <tr>
          <th>Posición</th>
          <th>Piloto</th>
          <th>Equipo</th>
          <th>Puntos</th>
          <th>Ver Resultados</th> <!-- Nueva columna para el botón -->
        </tr>
      </thead>
      <tbody>
        <!-- Resultados de la temporada -->
      </tbody>
    </table>
  </main>

  <script src="script.js"></script>
</body>
</html>
