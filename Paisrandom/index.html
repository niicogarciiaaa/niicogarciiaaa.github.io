<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <title>Adivina el País</title>
    <script src="script.js" defer></script>

    <style>
        /* Aplicar color blanco a todo el texto */
        body {
            color: white;
        }

        .alert-info {
            color: #333; /* Asegura que el texto de la pista sea visible sobre el fondo claro */
        }
    </style>
</head>
<body class="bg-dark"> <!-- Fondo oscuro para contrastar con el texto blanco -->

    <!-- Contenedor principal -->
    <div class="container py-5">
        <div class="text-center">
            <h1>Adivina el País</h1>
            <div id="correctCount" class="my-3">Respuestas correctas: 0</div>
            
            <!-- Pista (hint) -->
            <div id="hint" class="alert alert-info my-3"></div>

            <!-- Campo de entrada para la respuesta -->
            <input type="text" id="guess" class="form-control mb-3" placeholder="Escribe tu respuesta">

            <!-- Contenedor de sugerencias -->
            <div id="suggestions" class="my-3"></div>

            <!-- Botón para adivinar -->
            <button id="submit" class="btn btn-primary">Adivinar</button>

            <!-- Resultado -->
            <div id="result" class="mt-3"></div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
