<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Adivina el País</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Adivina el País</h1>
        <div id="correctCount">Respuestas correctas: 0</div><br/>
        <div id="hint"></div>
        <input type="text" id="guess" placeholder="Escribe tu respuesta">
        <div id="suggestions"></div> <!-- Contenedor para las sugerencias -->
        <button id="submit">Adivinar</button>
        <div id="result"></div>
    </div>
    
</body>
</html>
