<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Fútbol</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="quiz-container">
        <h1>Quiz de Fútbol</h1>
        <div id="question-container">
            <p id="question"></p>
            <form id="quiz-form">
                <div id="inputs-container">
                    <input type="text" id="answer" placeholder="Introduce los jugadores, separados por coma">
                </div>
                <button type="submit">Comprobar</button>
            </form>
        </div>
        <div id="result"></div>
        <button id="next-btn" style="display:none;" onclick="nextQuestion()">Siguiente pregunta</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
