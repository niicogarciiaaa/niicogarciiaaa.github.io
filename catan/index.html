<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catan - Juego</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Juego de Catan</h1>

    <div id="boardContainer"></div>

    <div>
        <h2>Jugadores</h2>
        <input type="text" id="playerName" placeholder="Nombre del jugador" />
        <button id="addPlayerButton">Añadir jugador</button>
    </div>

    <div>
        <h2>Acciones del jugador</h2>
        <button id="rollDiceButton">Tirar los dados</button>
        <button id="buildTownButton">Construir poblado</button>
        <button id="buildCityButton">Construir ciudad</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
